name: Daily Sahih Hadith Short

on:
  schedule:
    - cron: "30 6-18/2 * * *"   # every 2 h from 12:00 to 00:00 IST: posts whichever of the
                                 # 12:00 / 20:00 videos is due and missing (GitHub may delay or skip runs)
  workflow_dispatch:

permissions:
  contents: write

concurrency: hadith-short

jobs:
  hadith:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is a video due?
        id: due
        run: python hadith_shorts/due.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0 libfribidi0
        if: steps.due.outputs.due == 'true'
      - run: pip install -r requirements.txt -r hadith_shorts/requirements.txt
        if: steps.due.outputs.due == 'true'
      - name: Hadith data (fawazahmed0/hadith-api), fonts and backgrounds
        if: steps.due.outputs.due == 'true'
        run: |
          mkdir -p data/hadith data/bg && cp deploy/bg/*.mp4 data/bg/
          for f in ara-bukhari eng-bukhari urd-bukhari ara-muslim eng-muslim urd-muslim; do
            curl -sfL --retry 3 -o data/hadith/$f.json "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/$f.json"
          done
          python -c "import video; video.ensure_fonts()"
      - name: Tests
        if: steps.due.outputs.due == 'true'
        run: python -m pytest tests -q
      - name: Make (and upload) today's video
        if: steps.due.outputs.due == 'true'
        run: python -m hadith_shorts daily
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          ENABLE_PUBLICATION: ${{ vars.HADITH_PUBLISH || 'false' }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.HADITH_PRIVACY || 'private' }}
          PUBLISH_TIME: ${{ vars.HADITH_PUBLISH_TIME || '' }}
          VIDEOS_PER_DAY: ${{ vars.HADITH_PER_DAY || '2' }}
          ENGLISH_VOICE: ${{ vars.HADITH_VOICE || 'en-US-AndrewMultilingualNeural' }}
          ENGLISH_RATE: ${{ vars.HADITH_VOICE_RATE || '-8%' }}
          SLOT_LANGS: ${{ vars.HADITH_LANGS || 'en,ur' }}
      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadith-short
          path: output/hadith/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save history
        if: always()
        run: |
          git config user.name "hadith-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hadith_shorts/history.sqlite
          git commit -m "hadith history" || exit 0
          git pull --rebase && git push
