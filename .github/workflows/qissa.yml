name: Daily Qissa story

on:
  schedule:
    - cron: "30 3 * * *"     # 09:00 IST: made and uploaded private, public at 14:00 IST
    - cron: "30 8 * * *"     # 14:00 IST: made and uploaded private, public at 19:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency: qissa-story

jobs:
  qissa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0 libfribidi0
      - run: pip install -r requirements.txt -r hadith_shorts/requirements.txt
      - name: Reuse Quran text and translations
        uses: actions/cache@v4
        with:
          path: |
            data/quran_v3.json
            data/tr_*.json
            data/footage
          key: qissa-data-${{ github.run_id }}
          restore-keys: qissa-data-
      - name: Hadith data, fonts
        run: |
          mkdir -p data/hadith fonts
          for f in ara-bukhari eng-bukhari urd-bukhari ara-muslim eng-muslim urd-muslim; do
            curl -sfL --retry 3 -o data/hadith/$f.json "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/$f.json"
          done
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          curl -sfL -o fonts/CourierPrime-Bold.ttf https://github.com/google/fonts/raw/main/ofl/courierprime/CourierPrime-Bold.ttf
          python -c "import video; video.ensure_fonts()"
      - name: Make (and upload) the next Qissa video
        run: python -m qissa daily
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          QISSA_PUBLISH: ${{ vars.QISSA_PUBLISH || 'false' }}
          QISSA_DELAY_HOURS: ${{ vars.QISSA_DELAY_HOURS || '5' }}
      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qissa-video
          path: output/qissa/*.mp4
          retention-days: 7
      - name: Save progress
        if: always()
        run: |
          git config user.name "qissa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add qissa/published.json 2>/dev/null || true
          git commit -m "qissa progress" || exit 0
          git pull --rebase && git push
