# Deploy (once logged in with `npx wrangler login`):  cd deploy/cloudflare-worker && npx wrangler deploy
name = "quranreelmaker-switching"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "quranreelmaker.xyz/*", zone_name = "quranreelmaker.xyz" },
  { pattern = "www.quranreelmaker.xyz/*", zone_name = "quranreelmaker.xyz" },
]

# keep the free Render backup awake (it sleeps after 15 idle minutes)
[triggers]
crons = ["*/10 * * * *"]

[vars]
BACKUP_URL = ""   # e.g. https://quranreelmaker.onrender.com ; PROXY_SECRET: npx wrangler secret put PROXY_SECRET
